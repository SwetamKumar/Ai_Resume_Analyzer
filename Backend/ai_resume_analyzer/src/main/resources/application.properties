spring.application.name=ai-resume-analyzer
server.port=8081

# OpenRouter API Key - Get free key from https://openrouter.ai/
# Sign up with Google account, no credit card required
openrouter.api.key=your_key

# File upload settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.resumeanalyzer=DEBUG
